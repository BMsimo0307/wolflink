name: wolflink
description: Application Web Companion pour le jeu du Loup-Garou
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  
  # Navigation  
  go_router: ^12.0.0
  
  # State Management
  provider: ^6.1.1
  
  # Network & WebSockets
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  
  # UI & Styling
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
